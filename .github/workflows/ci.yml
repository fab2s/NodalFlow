name: CI
on: [pull_request]
jobs:
  tests:
    name: NodalFlow (PHP ${{ matrix.php-versions }} / dispatcher ${{ matrix.dispatcher-versions }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: [ '8.5', '8.4', '8.3', '8.2' ]
        dispatcher-versions: [ '8.1.*', '8.0.*', '7.4.*', '7.0.*', '6.4.*' ]
        exclude:
          # Symfony 8 requires PHP >= 8.4
          - php-versions: 8.3
            dispatcher-versions: 8.1.*
          - php-versions: 8.3
            dispatcher-versions: 8.0.*
          - php-versions: 8.2
            dispatcher-versions: 8.1.*
          - php-versions: 8.2
            dispatcher-versions: 8.0.*

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, dom, fileinfo, gmp, bcmath

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Remove QA dependencies
        run: composer remove "laravel/pint" --dev --no-update

      - name: Remove composer.lock
        run: rm -f composer.lock

      - name: Install Symfony event-dispatcher ${{ matrix.dispatcher-versions }}
        run: composer require "symfony/event-dispatcher:${{ matrix.dispatcher-versions }}" --dev --no-update

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Test with phpunit
        run: vendor/bin/phpunit
